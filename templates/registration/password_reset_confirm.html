{% extends "base.html" %}
{% block content %}
<h1>Nouveau mot de passe</h1>
{% if validlink %}
  <form method="post">{% csrf_token %}{{ form.as_p }}<button>Enregistrer</button></form>
{% else %}
  <p>Ce lien n’est plus valable. <a href="{% url 'password_reset' %}">Demander un nouveau lien</a></p>
{% endif %}
{% endblock %}
