<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Voyages entre amis{% endblock %}</title>
</head>
<body>
<nav>
  <a href="{% url 'trip_list' %}">Mes voyages</a>
  {% if user.is_authenticated %}
    {{ user.email }}
    <form method="post" action="{% url 'logout' %}" style="display:inline">{% csrf_token %}<button>Se déconnecter</button></form>
  {% else %}
    <a href="{% url 'login' %}">Se connecter</a>
  {% endif %}
</nav>
<hr>
{% if messages %}<ul>{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>{% endif %}
{% block content %}{% endblock %}
</body>
</html>
