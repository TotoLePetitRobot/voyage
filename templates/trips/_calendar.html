{% for month in months %}
<table class="cal">
  <caption>{{ month.title }}</caption>
  <thead><tr><th>Lun</th><th>Mar</th><th>Mer</th><th>Jeu</th><th>Ven</th><th>Sam</th><th>Dim</th></tr></thead>
  <tbody>
  {% for week in month.weeks %}<tr>
    {% for c in week %}
      {% if c %}<td{% if c.letters %} class="busy"{% endif %}><button type="button" class="day" data-date="{{ c.iso }}"{% if c.past %} disabled{% endif %} aria-label="{{ c.label }}">{{ c.day }}{% if c.letters %}<span class="tag">{{ c.letters|join:"" }}</span>{% endif %}</button></td>{% else %}<td></td>{% endif %}
    {% endfor %}
  </tr>{% endfor %}
  </tbody>
</table>
{% endfor %}
