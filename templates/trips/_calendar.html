{% for month in months %}
<table class="cal">
  <caption>{{ month.title }}</caption>
  <thead><tr><th>Lun</th><th>Mar</th><th>Mer</th><th>Jeu</th><th>Ven</th><th>Sam</th><th>Dim</th></tr></thead>
  <tbody>
  {% for week in month.weeks %}<tr>
    {% for c in week %}
      {% if c %}<td{% if c.letters %} class="busy"{% endif %}>{{ c.day }}{% if c.letters %}<br><b>{{ c.letters|join:"" }}</b>{% endif %}</td>{% else %}<td></td>{% endif %}
    {% endfor %}
  </tr>{% endfor %}
  </tbody>
</table>
{% endfor %}
